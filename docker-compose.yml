# Video-Creator-Worker + Caddy (Reverse-Proxy mit Auto-SSL via Let's Encrypt)
# Deploy auf Hetzner: `docker compose up -d --build`
# Benötigt .env-Datei neben dieser compose-Datei.

services:
  worker:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      FAL_KEY: ${FAL_KEY}
      # Google AI Studio (Gemini 3 Pro Image a.k.a. "nano banana" + 2.5 Flash Image Fallback)
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      # Optional: Google Cloud Vertex AI (Imagen-Fallback, nur wenn ADC + Projekt da)
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      # CORS: erlaubte Origins (z.B. https://app.herrtechgpt.de,http://localhost:3001)
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      # Selbst-gehostete cobalt-Instanz als Fallback wenn yt-dlp geblockt wird
      COBALT_HOST: cobalt-api
      COBALT_PORT: "9000"
    depends_on:
      cobalt-api:
        condition: service_started
    volumes:
      - worker-projects:/app/data/projects
      - worker-uploads:/app/uploads
      - worker-out:/app/out
      # Für yt-dlp Cookies (optional, für YouTube/Instagram Rate-Limits)
      - ./cookies:/app/cookies:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/check-env"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Selbst-gehosteter cobalt-Dienst als Fallback für yt-dlp.
  # Wird intern vom worker über http://cobalt-api:9000/ angesprochen, nicht nach außen exponiert.
  cobalt-api:
    image: ghcr.io/imputnet/cobalt:10
    init: true
    read_only: true
    restart: unless-stopped
    expose:
      - "9000"
    environment:
      API_URL: "http://cobalt-api:9000/"
      API_LISTEN_ADDRESS: "0.0.0.0"
      DURATION_LIMIT: "10800"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - worker

volumes:
  worker-projects:
  worker-uploads:
  worker-out:
  caddy-data:
  caddy-config:
